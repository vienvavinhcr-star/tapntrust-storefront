<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How to find your business review link</title>
  <desc id="desc">Three illustrated steps based on Google's current desktop flow: open your Business Profile and select Read reviews, select Get more reviews, then copy the Google review link into TapNTrust.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061a45" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#86a4ca"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#f4f7fb"/>
  <path d="M383 278h52M765 278h52" fill="none" stroke="#86a4ca" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(40 40)" filter="url(#shadow)">
    <rect width="340" height="480" rx="24" fill="#fff"/>
    <circle cx="46" cy="48" r="25" fill="#1469ee"/><text x="46" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">1</text>
    <text x="82" y="56" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#061a45">Select “Read reviews”</text>
    <rect x="30" y="104" width="280" height="46" rx="23" fill="#f2f5f9" stroke="#ccd8e7" stroke-width="2"/>
    <circle cx="57" cy="127" r="10" fill="none" stroke="#64748b" stroke-width="3"/><path d="m65 135 10 10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="88" y="119" width="152" height="12" rx="6" fill="#b4c2d4"/>
    <rect x="30" y="176" width="280" height="206" rx="18" fill="#f8fafc" stroke="#d7e0ec" stroke-width="2"/>
    <circle cx="78" cy="228" r="27" fill="#e1ebf9"/><path d="M64 229h28M78 215v28" stroke="#1469ee" stroke-width="4" stroke-linecap="round"/>
    <rect x="122" y="208" width="133" height="14" rx="7" fill="#0b2d70"/><rect x="122" y="237" width="100" height="10" rx="5" fill="#9aaac0"/>
    <rect x="58" y="301" width="222" height="42" rx="10" fill="#e8f0fe" stroke="#aecbfa" stroke-width="2"/><text x="169" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#174ea6">Read reviews</text>
    <text x="30" y="430" font-family="Arial, sans-serif" font-size="18" fill="#51627e">Search your business name, then</text><text x="30" y="456" font-family="Arial, sans-serif" font-size="18" fill="#51627e">select “Read reviews”.</text>
  </g>
  <g transform="translate(430 40)" filter="url(#shadow)">
    <rect width="340" height="480" rx="24" fill="#fff"/>
    <circle cx="46" cy="48" r="25" fill="#1469ee"/><text x="46" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">2</text>
    <text x="82" y="56" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#061a45">Select “Get more reviews”</text>
    <rect x="30" y="105" width="280" height="272" rx="18" fill="#f8fafc" stroke="#d7e0ec" stroke-width="2"/>
    <rect x="57" y="137" width="226" height="18" rx="9" fill="#0b2d70"/><rect x="57" y="171" width="164" height="10" rx="5" fill="#9aaac0"/>
    <rect x="55" y="218" width="230" height="92" rx="16" fill="#e8f0fe" stroke="#aecbfa" stroke-width="3"/>
    <g transform="translate(78 246)" fill="none" stroke="#1a73e8" stroke-width="4" stroke-linecap="round"><path d="M0 20h31V0M31 0 13 18M31 0 13-3"/></g>
    <text x="130" y="256" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#174ea6">Get more reviews</text><text x="130" y="281" font-family="Arial, sans-serif" font-size="14" fill="#5f6368">Link and QR code</text>
    <text x="30" y="430" font-family="Arial, sans-serif" font-size="18" fill="#51627e">Google opens your shareable</text><text x="30" y="456" font-family="Arial, sans-serif" font-size="18" fill="#51627e">review link and QR code.</text>
  </g>
  <g transform="translate(820 40)" filter="url(#shadow)">
    <rect width="340" height="480" rx="24" fill="#fff"/>
    <circle cx="46" cy="48" r="25" fill="#1469ee"/><text x="46" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">3</text>
    <text x="82" y="56" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#061a45">Copy and paste the link</text>
    <rect x="30" y="105" width="280" height="272" rx="18" fill="#f8fafc" stroke="#d7e0ec" stroke-width="2"/>
    <text x="56" y="151" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#51627e">Google review link</text>
    <rect x="54" y="170" width="232" height="48" rx="10" fill="#fff" stroke="#b6c5d8" stroke-width="2"/><rect x="71" y="188" width="126" height="10" rx="5" fill="#a8b7ca"/><rect x="217" y="179" width="54" height="29" rx="7" fill="#1469ee"/><text x="244" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">COPY</text>
    <path d="M170 244v33" stroke="#86a4ca" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="54" y="294" width="232" height="50" rx="10" fill="#fff" stroke="#1469ee" stroke-width="3"/><rect x="71" y="313" width="157" height="11" rx="5" fill="#bfd2ed"/>
    <text x="30" y="430" font-family="Arial, sans-serif" font-size="18" fill="#51627e">Paste it into TapNTrust when</text><text x="30" y="456" font-family="Arial, sans-serif" font-size="18" fill="#51627e">you choose your card package.</text>
  </g>
</svg>
