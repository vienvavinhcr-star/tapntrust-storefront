name: Tapntrust Insight app refresh

on:
  push:
    branches:
      - feature/app-dashboard-refresh
    paths:
      - .github/workflows/app-dashboard-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-dashboard-refresh
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh customer dashboard UI
        run: python3 scripts/app-dashboard-refresh-once.py
      - run: pnpm run check:all
      - name: Commit refreshed dashboard
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "Tapntrust UI automation"
          git config user.email "actions@users.noreply.github.com"
          git add insights-worker/src/customer-page.ts
          git commit -m "feat: refresh Tapntrust Insight customer dashboard"
          git push origin HEAD:feature/app-dashboard-refresh
