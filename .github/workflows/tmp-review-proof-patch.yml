name: Temporary review proof patch

on:
  push:
    branches:
      - ui/review-proof-star-animation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply narrow Codex review-proof patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()

          css_anchor = '<link rel="stylesheet" href="css/styles.min.css?v=20260831-1">'
          css_insert = css_anchor + '\n  <link rel="stylesheet" href="css/review-proof-animation.css?v=20260903-1">'
          if 'css/review-proof-animation.css' not in text:
              if css_anchor not in text:
                  raise SystemExit('styles.min.css anchor not found')
              text = text.replace(css_anchor, css_insert, 1)

          old = '<span class="google-review-proof__stars" aria-hidden="true">★★★★★</span>'
          new = '''<span class="google-review-proof__stars" aria-hidden="true">\n              <span class="google-review-proof__star google-review-proof__star--1">★</span>\n              <span class="google-review-proof__star google-review-proof__star--2">★</span>\n              <span class="google-review-proof__star google-review-proof__star--3">★</span>\n              <span class="google-review-proof__star google-review-proof__star--4">★</span>\n              <span class="google-review-proof__star google-review-proof__star--5">★</span>\n            </span>'''
          if old not in text:
              raise SystemExit('review proof stars anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Run storefront checks
        run: npm run check

      - name: Commit final two-file change
        run: |
          rm .github/workflows/tmp-review-proof-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/review-proof-animation.css .github/workflows/tmp-review-proof-patch.yml
          git commit -m "Animate Google review proof stars"
          git push origin HEAD:ui/review-proof-star-animation
