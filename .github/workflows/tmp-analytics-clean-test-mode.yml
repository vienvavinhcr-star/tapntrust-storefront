name: Temporary analytics-clean test-mode patch

on:
  push:
    branches:
      - fix/analytics-clean-test-mode

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tmp-analytics-clean-patch.py
      - run: npm run check
      - run: |
          rm scripts/tmp-analytics-clean-patch.py
          rm .github/workflows/tmp-analytics-clean-test-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make owner test mode analytics-clean"
          git push origin HEAD:fix/analytics-clean-test-mode
