name: Tapntrust Shopify programming URL sync fix

on:
  push:
    branches:
      - fix/shopify-order-programming-urls
    paths:
      - .github/workflows/shopify-programming-sync-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shopify-order-programming-urls
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch automatic Shopify programming URL sync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provisioning = Path('insights-worker/src/shopify-order-provisioning.ts')
          text = provisioning.read_text()
          text = text.replace(
              'import { normaliseGoogleReviewUrl, type ProvisioningIntent } from "./provisioning";',
              'import { normaliseGoogleReviewUrl, type ProvisioningIntent, type ProvisioningManifest } from "./provisioning";'
          )
          text = text.replace(
              'export interface AutoProvisionedShopifyBatch {\n  batchId: string;',
              'export interface AutoProvisionedShopifyBatch {\n  manifest: ProvisioningManifest;\n  batchId: string;'
          )
          text = text.replace(
              '    results.push({\n      batchId: provisioned.manifest.id,',
              '    results.push({\n      manifest: provisioned.manifest,\n      batchId: provisioned.manifest.id,'
          )
          provisioning.write_text(text)

          index = Path('insights-worker/src/index.ts')
          text = index.read_text()
          old = '    if (url.pathname === "/api/shopify/webhooks/orders-paid") {\n      await autoProvisionPaidShopifyOrder(request.clone(), env, new Date());\n      return handleShopifyOrdersPaidWebhook(request, env, () => new Date(), billingDependencies);\n    }'
          new = '    if (url.pathname === "/api/shopify/webhooks/orders-paid") {\n      const provisionedBatches = await autoProvisionPaidShopifyOrder(request.clone(), env, new Date());\n      if (adminDependencies.syncProgrammingManifest) {\n        for (const batch of provisionedBatches) {\n          ctx.waitUntil(\n            adminDependencies.syncProgrammingManifest(batch.manifest)\n              .then((result) => {\n                console.log(JSON.stringify({ event: "shopify_programming_urls_synced", orderReference: batch.manifest.externalOrderReference.slice(0, 80), setupReference: batch.manifest.externalSetupReference.slice(0, 80), cardCount: batch.manifest.cards.length, orderName: result.orderName }));\n              })\n              .catch((error) => {\n                console.warn(JSON.stringify({ event: "shopify_programming_urls_sync_failed", orderReference: batch.manifest.externalOrderReference.slice(0, 80), setupReference: batch.manifest.externalSetupReference.slice(0, 80), error: error instanceof Error ? error.message : String(error) }));\n              })\n          );\n        }\n      }\n      return handleShopifyOrdersPaidWebhook(request, env, () => new Date(), billingDependencies);\n    }'
          if old not in text:
              raise SystemExit('orders-paid block not found')
          index.write_text(text.replace(old, new, 1))
          PY
      - name: Verify repository checks
        run: pnpm run check:all
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Tapntrust automation"
          git config user.email "actions@users.noreply.github.com"
          git add insights-worker/src/index.ts insights-worker/src/shopify-order-provisioning.ts
          git commit -m "fix: sync NFC programming URLs to Shopify orders"
          git push origin HEAD:fix/shopify-order-programming-urls
