name: Tapntrust Insight mobile dashboard fix

on:
  push:
    branches:
      - fix/mobile-dashboard-overflow
    paths:
      - .github/workflows/mobile-dashboard-fix-once.yml

permissions:
  contents: write

jobs:
  fix-mobile-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-dashboard-overflow
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix mobile layout and use transparent mascot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('insights-worker/src/customer-page.ts')
          page = page_path.read_text()

          # Use the owner-provided transparent mascot everywhere in the customer app.
          page = page.replace('/tapntrust-insights-mascot.png', '/tapntrust-insights-mascot-transparent.png')

          marker = '/* mobile-dashboard-overflow-fix-2026-09-15 */'
          css = r'''
              /* mobile-dashboard-overflow-fix-2026-09-15 */
              html,body{max-width:100%;overflow-x:hidden}
              .next-step,.next-step-copy,#next-step-title,#next-step-body,#next-step-proof,.recommendation-proof,.roadmap-panel,.roadmap-copy,.roadmap-panel h2,.roadmap-copy p,.roadmap-highlight,.roadmap-highlight strong,.roadmap-contact,.roadmap-contact>*,.roadmap-art,.roadmap-art-card,.roadmap-art-card>*{min-width:0;max-width:100%}
              #next-step-title,#next-step-body,#next-step-proof,.recommendation-proof,.roadmap-panel h2,.roadmap-copy p,.roadmap-highlight strong,.roadmap-contact p,.roadmap-contact a,.roadmap-art-card strong,.roadmap-art-card small{overflow-wrap:anywhere;word-break:normal}
              .recommendation-proof{white-space:normal;line-height:1.4}

              @media(max-width:760px){
                .next-step{grid-template-columns:minmax(0,1fr);gap:14px;padding:20px 16px;overflow:hidden}
                .next-step:after{width:160px;height:160px;right:-78px;top:-86px}
                .guide-art{justify-self:center;align-self:center;margin:-8px 0 0;max-width:150px}
                .guide-art img{display:block;width:132px;max-width:100%;height:auto;margin:0 auto}
                .next-step-copy{width:100%}
                .next-step h2{font-size:clamp(1.65rem,7.8vw,2.15rem);line-height:1.08;margin:6px 0 10px}
                .next-step p{max-width:100%;font-size:1rem;line-height:1.55}
                .recommendation-proof{display:flex;width:100%;align-items:flex-start;justify-content:flex-start;gap:9px;margin-top:14px;padding:10px 12px;border-radius:15px;font-size:.78rem}
                .recommendation-proof:before{flex:0 0 7px;margin-top:.42em}

                .roadmap-panel{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:22px 16px;overflow:hidden}
                .roadmap-copy{width:100%}
                .roadmap-panel h2{font-size:clamp(1.85rem,8vw,2.35rem);line-height:1.06;letter-spacing:-.045em}
                .roadmap-lead{font-size:1rem}
                .roadmap-highlight{grid-template-columns:32px minmax(0,1fr);gap:10px;padding:14px;margin:16px 0;border-radius:14px}
                .roadmap-bolt{width:30px;height:30px}
                .roadmap-features{grid-template-columns:minmax(0,1fr);gap:8px;margin:18px 0}
                .roadmap-features span{width:100%;min-height:48px}
                .roadmap-contact{grid-template-columns:42px minmax(0,1fr);gap:11px;padding:14px}
                .roadmap-contact-icon{width:40px;height:40px;border-radius:12px}
                .roadmap-art{order:initial;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:12px 0 0;margin:0;overflow:hidden}
                .roadmap-orbit{display:none}
                .roadmap-mascot{width:min(150px,42vw);max-width:150px;filter:drop-shadow(0 14px 22px rgba(23,105,237,.13))}
                .roadmap-mascot .mascot-crop{margin:0 auto}
                .roadmap-art-card{position:static;right:auto;bottom:auto;width:100%;max-width:420px;margin:0 auto;padding:13px 14px;border-radius:15px;box-shadow:0 10px 26px rgba(7,27,69,.08)}
              }

              @media(max-width:420px){
                .next-step{padding:18px 14px;border-radius:18px}
                .guide-art{max-width:126px}
                .guide-art img{width:112px}
                .next-step h2{font-size:clamp(1.55rem,8vw,1.95rem)}
                .recommendation-proof{font-size:.74rem;padding:10px 11px}
                .roadmap-panel{padding:18px 14px;border-radius:18px}
                .roadmap-kicker{max-width:100%;padding:6px 9px;font-size:.64rem;letter-spacing:.09em;white-space:normal}
                .roadmap-panel h2{font-size:clamp(1.7rem,8.4vw,2.05rem)}
                .roadmap-highlight{grid-template-columns:minmax(0,1fr);padding:13px}
                .roadmap-bolt{margin-bottom:2px}
                .roadmap-contact{grid-template-columns:minmax(0,1fr)}
                .roadmap-contact-icon{width:38px;height:38px}
                .roadmap-mascot{width:min(132px,40vw)}
                .roadmap-art-card{padding:12px 13px}
              }
          '''

          if marker not in page:
              if '</style>' not in page:
                  raise SystemExit('customer page style closing tag not found')
              page = page.replace('</style>', css + '\n  </style>', 1)

          page_path.write_text(page)

          test_path = Path('insights-worker/test/customer-auth.test.ts')
          test = test_path.read_text()
          test = test.replace('src="/tapntrust-insights-mascot.png"', 'src="/tapntrust-insights-mascot-transparent.png"')
          test = test.replace('src="\\/tapntrust-insights-mascot\\.png"', 'src="\\/tapntrust-insights-mascot-transparent\\.png"')
          test_path.write_text(test)

          docs_path = Path('docs/INSIGHTS.md')
          docs = docs_path.read_text().replace('insights-worker/assets/tapntrust-insights-mascot.png', 'insights-worker/assets/tapntrust-insights-mascot-transparent.png')
          docs_path.write_text(docs)
          PY
      - name: Verify repository checks
        run: pnpm run check:all
      - name: Commit mobile fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No mobile dashboard changes to commit."
            exit 0
          fi
          git config user.name "Tapntrust UI automation"
          git config user.email "actions@users.noreply.github.com"
          git add insights-worker/src/customer-page.ts insights-worker/test/customer-auth.test.ts docs/INSIGHTS.md
          git commit -m "fix: polish Tapntrust Insight mobile dashboard"
          git push origin HEAD:fix/mobile-dashboard-overflow
