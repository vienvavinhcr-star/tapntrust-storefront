name: Tapntrust admin paid subscriptions KPI

on:
  push:
    branches:
      - fix/admin-paid-subscriptions-kpi
    paths:
      - .github/workflows/admin-paid-subscriptions-kpi-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-paid-subscriptions-kpi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch admin analytics billing visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          analytics = Path('insights-worker/src/admin-analytics.ts')
          text = analytics.read_text()
          text = text.replace(
              '    activeInsightsLocations: number;\n    dashboardOpens: number;',
              '    activeInsightsLocations: number;\n    activePaidSubscriptions: number;\n    dashboardOpens: number;'
          )
          text = text.replace(
              '      let activeInsightsLocations = 0;\n      let dashboardOpens = 0;',
              '      let activeInsightsLocations = 0;\n      let activePaidSubscriptions = 0;\n      let dashboardOpens = 0;'
          )
          text = text.replace(
              '        if (location.insightsStatus === "active") activeInsightsLocations += 1;\n        dashboardOpens += location.dashboardUsage.opens;',
              '        if (location.insightsStatus === "active") activeInsightsLocations += 1;\n        if (location.subscription?.status === "active") activePaidSubscriptions += 1;\n        dashboardOpens += location.dashboardUsage.opens;'
          )
          text = text.replace(
              '          activeInsightsLocations,\n          dashboardOpens,',
              '          activeInsightsLocations,\n          activePaidSubscriptions,\n          dashboardOpens,'
          )
          analytics.write_text(text)

          page = Path('insights-worker/src/admin-analytics-page.ts')
          text = page.read_text()
          text = text.replace(
              '.crm-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:16px 0}',
              '.crm-kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:16px 0}'
          )
          text = text.replace(
              '.crm-pill.pending{background:#fff7df;color:#9a6700}',
              '.crm-pill.pending{background:#fff7df;color:#9a6700}.crm-paid-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#e8f8ef;color:#087a47;font-size:.69rem;font-weight:900}.crm-paid-badge:before{content:"✓"}.crm-row-paid td{background:#fbfffc}.crm-row-paid td:first-child{box-shadow:inset 3px 0 0 #39a96b}.crm-billing-plan{font-weight:850;color:var(--navy)}'
          )
          old_kpis = '<div class="crm-kpi"><div class="crm-kpi__label">Active Insights</div><div class="crm-kpi__value" data-crm-kpi="insights">—</div><div class="crm-kpi__note">Locations</div></div><div class="crm-kpi"><div class="crm-kpi__label">Google API calls</div><div class="crm-kpi__value" data-crm-kpi="google">—</div><div class="crm-kpi__note">Actual provider calls</div></div>'
          new_kpis = '<div class="crm-kpi"><div class="crm-kpi__label">Active Insights</div><div class="crm-kpi__value" data-crm-kpi="insights">—</div><div class="crm-kpi__note">Dashboard access</div></div><div class="crm-kpi"><div class="crm-kpi__label">Paid subscriptions</div><div class="crm-kpi__value" data-crm-kpi="paid">—</div><div class="crm-kpi__note">Shopify billing status active</div></div><div class="crm-kpi"><div class="crm-kpi__label">Google API calls</div><div class="crm-kpi__value" data-crm-kpi="google">—</div><div class="crm-kpi__note">Actual provider calls</div></div>'
          if old_kpis not in text:
              raise SystemExit('KPI block not found')
          text = text.replace(old_kpis, new_kpis, 1)
          old_subscription = "const subscription = row.subscription ? '<div class=\"crm-sub\">'+esc(row.subscription.planCode)+' · '+esc(money(row.subscription.recurringPriceMinor,row.subscription.currency))+'/month</div><div class=\"crm-sub\">Billing '+pill(row.subscription.status)+'</div><div class=\"crm-sub\">Next: '+esc(dateTime(row.subscription.nextBillingAt))+'</div>' : '<div class=\"crm-sub\">No paid Insights subscription</div>';"
          new_subscription = "const subscription = row.subscription ? '<div class=\"crm-sub\">'+(row.subscription.status === 'active' ? '<span class=\"crm-paid-badge\">Paid subscription</span>' : 'Shopify subscription')+'</div><div class=\"crm-sub crm-billing-plan\">'+esc(row.subscription.planCode)+' · '+esc(money(row.subscription.recurringPriceMinor,row.subscription.currency))+'/month</div><div class=\"crm-sub\">Billing '+pill(row.subscription.status)+'</div><div class=\"crm-sub\">Last paid: '+esc(dateTime(row.subscription.lastPaidAt))+'</div><div class=\"crm-sub\">Next: '+esc(dateTime(row.subscription.nextBillingAt))+'</div>' : '<div class=\"crm-sub\">No paid Shopify subscription</div>';"
          if old_subscription not in text:
              raise SystemExit('subscription renderer not found')
          text = text.replace(old_subscription, new_subscription, 1)
          text = text.replace(
              "return '<tr><td><div class=\"crm-title\">'+esc(email)",
              "return '<tr class=\"'+(row.subscription?.status === 'active' ? 'crm-row-paid' : '')+'\"><td><div class=\"crm-title\">'+esc(email)",
              1
          )
          text = text.replace(
              "panel.querySelector('[data-crm-kpi=\"insights\"]').textContent = number(data.totals.activeInsightsLocations);\n    panel.querySelector('[data-crm-kpi=\"google\"]').textContent = number(data.totals.googleProviderCalls);",
              "panel.querySelector('[data-crm-kpi=\"insights\"]').textContent = number(data.totals.activeInsightsLocations);\n    panel.querySelector('[data-crm-kpi=\"paid\"]').textContent = number(data.totals.activePaidSubscriptions);\n    panel.querySelector('[data-crm-kpi=\"google\"]').textContent = number(data.totals.googleProviderCalls);",
              1
          )
          page.write_text(text)

          test = Path('insights-worker/test/admin-analytics.test.ts')
          text = test.read_text()
          entitlement_line = '      env.DB.prepare("INSERT INTO insights_entitlements (location_id, status, source, activated_at) VALUES (?1, \'active\', \'shopify\', \'2026-09-14T01:00:00.000Z\')").bind(locationId),\n'
          subscription_line = '''      env.DB.prepare(`INSERT INTO insights_subscriptions (id, business_id, location_id, provider, billing_email, external_setup_reference, first_provider_order_reference, most_recent_provider_order_reference, plan_code, status, currency, expected_intro_price_minor, expected_recurring_price_minor, started_at, last_paid_at, expected_next_billing_at, current_period_started_at, current_period_ends_at) VALUES ('sub-crm', ?1, ?2, 'shopify', 'owner@example.com', 'setup-crm', '#1001', '#1001', 'intro', 'active', 'AUD', 199, 699, '2026-09-14T01:00:00.000Z', '2026-09-14T01:00:00.000Z', '2026-10-14T01:00:00.000Z', '2026-09-14T01:00:00.000Z', '2026-10-14T01:00:00.000Z')`).bind(businessId, locationId),\n'''
          if entitlement_line not in text:
              raise SystemExit('test entitlement fixture not found')
          text = text.replace(entitlement_line, entitlement_line + subscription_line, 1)
          text = text.replace(
              '    expect(snapshot.totals.lifetimeTaps).toBe(2);\n    expect(snapshot.totals.googleProviderCalls).toBe(1);',
              '    expect(snapshot.totals.lifetimeTaps).toBe(2);\n    expect(snapshot.totals.activeInsightsLocations).toBe(1);\n    expect(snapshot.totals.activePaidSubscriptions).toBe(1);\n    expect(snapshot.totals.googleProviderCalls).toBe(1);'
          )
          text = text.replace(
              '      insightsStatus: "active",\n      dashboardUsage:',
              '      insightsStatus: "active",\n      subscription: {\n        status: "active",\n        planCode: "intro",\n        billingEmail: "owner@example.com",\n        currency: "AUD",\n        recurringPriceMinor: 699\n      },\n      dashboardUsage:'
          )
          text = text.replace(
              '    expect(row?.subscription).toBeNull();',
              '    expect(row?.subscription).toBeNull();\n    expect(snapshot.totals.activePaidSubscriptions).toBe(0);'
          )
          test.write_text(text)
          PY
      - name: Verify repository checks
        run: pnpm run check:all
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Tapntrust automation"
          git config user.email "actions@users.noreply.github.com"
          git add insights-worker/src/admin-analytics.ts insights-worker/src/admin-analytics-page.ts insights-worker/test/admin-analytics.test.ts
          git commit -m "feat: separate paid Insights subscriptions in admin CRM"
          git push origin HEAD:fix/admin-paid-subscriptions-kpi
